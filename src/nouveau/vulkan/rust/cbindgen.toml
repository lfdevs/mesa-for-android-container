language = "C"

includes = ["nvk_video_session.h"]
autogen_warning = "/* Warning, this file is autogenerated by cbindgen. Don't modify this manually. */"
include_guard = "NVK_RUST_H"
usize_is_size_t = true
style = "tag"

# Rename everything from bindgen
# See https://github.com/mozilla/cbindgen/issues/621
[export.rename]
"nv_push" = "struct nv_push"
"nvk_cmd_buffer" = "struct nvk_cmd_buffer"
"nvk_queue" = "struct nvk_queue"
"nvk_video_session" = "struct nvk_video_session"

[enum]
prefix_with_name = true
rename_variants = "ScreamingSnakeCase"
