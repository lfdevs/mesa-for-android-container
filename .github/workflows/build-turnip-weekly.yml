          echo "MESA_RELEASE_NAME_SUFFIX=${version}-${build_date}_aosc_arm64" >> "$GITHUB_ENV"

      - name: Guard DRM-only fdperf
        shell: bash
        run: |
          cd ~/mesa-for-android-container
          python3 <<'PY'
          from pathlib import Path

          path = Path("src/freedreno/perfcntrs/meson.build")
          text = path.read_text()
          old = "if dep_libconfig.found() and dep_curses.found()\n"
          new = "if system_has_kms_drm and dep_libconfig.found() and dep_curses.found()\n"
          if text.count(old) != 1:
              raise SystemExit(f"Unexpected fdperf guard count: {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Build Mesa
        shell: bash
        run: |
          export CCACHE_DIR=/root/.ccache
          echo "Building Mesa..."
          cd ~/mesa-for-android-container
          meson setup build/ \
              --prefix=/usr \
              -Dplatforms=x11,wayland \
              -Dgallium-drivers= \
              -Dgallium-va=disabled \
              -Dgallium-mediafoundation=disabled \
              -Dvulkan-drivers=freedreno \
              -Dvulkan-layers= \
              -Dgles1=disabled \
              -Dgles2=disabled \
              -Dopengl=false \
              -Dgbm=disabled \
              -Dglx=disabled \
              -Dxlib-lease=disabled \
              -Dfreedreno-kmds=kgsl \
              -Degl=disabled \
              -Dglvnd=disabled \
              -Dintel-rt=disabled \
              -Dmicrosoft-clc=disabled \
              -Dllvm=disabled \
              -Dvalgrind=disabled \
              -Dbuild-tests=false \
              -Dlibunwind=disabled \
              -Dlmsensors=disabled \
              -Dandroid-libbacktrace=disabled \
              -Dbuildtype=release
          ninja -C build/
          echo "Mesa build completed successfully!"

      - name: Save ccache
        uses: actions/cache/save@v6
        if: always()
        with:
          path: /root/.ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Package Mesa
        shell: bash
