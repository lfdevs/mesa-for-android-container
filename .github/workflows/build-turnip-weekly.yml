      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: turnip-weekly_${{ env.MESA_RELEASE_NAME_SUFFIX }}_${{ needs.prepare-source.outputs.mesa_hash }}
          path: |
            ~/mesa-for-android-container/*.tar.gz
            ~/mesa-for-android-container/sha256sums.txt
          retention-days: 90

  nixos:
    needs: prepare-source
    runs-on: ubuntu-26.04-arm

    steps:
      - name: Download prepared source
        uses: actions/download-artifact@v8
        with:
          name: mesa-source-prepared
          path: ${{ github.workspace }}/artifacts

      - name: Extract prepared source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ~/mesa-for-android-container
          archive_path=$(find "$GITHUB_WORKSPACE/artifacts" -type f -name 'mesa-source-prepared.tar.gz' | head -n1)
          if [ -z "$archive_path" ]; then
            echo "Prepared source archive not found under $GITHUB_WORKSPACE/artifacts"
            exit 1
          fi
          tar -zxf "$archive_path" -C ~

      - name: Clone nixpkgs
        run: |
          git clone --branch nixos-26.05 --depth 1 https://github.com/NixOS/nixpkgs.git "$HOME/nixpkgs"

      - name: Set release name suffix
        shell: bash
        run: |
          cd ~/mesa-for-android-container
          version=$(grep -v '^[[:space:]]*$' VERSION | head -n1)
          build_date=$(TZ=Asia/Shanghai date +%Y%m%d)
          echo "MESA_RELEASE_NAME_SUFFIX=${version}-${build_date}_nixos_arm64" >> "$GITHUB_ENV"

      - name: Configure nixpkgs Mesa
        shell: bash
        run: |
          export MESA_VERSION="${MESA_RELEASE_NAME_SUFFIX%_nixos_arm64}"
          python3 <<'PY'
          import base64
          import os
          from pathlib import Path
          import re

          mesa = Path.home() / "nixpkgs/pkgs/development/libraries/mesa"

          def replace(text, pattern, replacement):
              text, count = re.subn(pattern, lambda _: replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise RuntimeError(f"Mesa recipe no longer matches: {pattern}")
              return text

          common = mesa / "common.nix"
          text = common.read_text()
          text = replace(text, r'  version = ".*?";', f'  version = "{os.environ["MESA_VERSION"]}";')
          # Use the checkout mounted in the build container, without a fixed-output hash.
          text = replace(text, r'  src = fetchFromGitLab \{.*?\n  \};',
                         '  src = lib.cleanSource /mesa-for-android-container;')
          common.write_text(text)

          # nixos-26.05 still provides wayland-protocols 1.48, while mesa/main
          # declares the protocol version from its own wrap file.
          wrap = Path.home() / "mesa-for-android-container/subprojects/wayland-protocols.wrap"
          wrap_text = wrap.read_text()
          wrap_version = re.search(r'^directory = wayland-protocols-(.+)$', wrap_text, re.M)
          wrap_hash = re.search(r'^source_hash = ([0-9a-f]{64})$', wrap_text, re.M)
          if wrap_version is None or wrap_hash is None:
              raise RuntimeError("mesa/main wayland-protocols.wrap is incomplete")
          protocol_version = wrap_version.group(1)
          protocol_hash = "sha256-" + base64.b64encode(bytes.fromhex(wrap_hash.group(1))).decode()

          protocols = Path.home() / "nixpkgs/pkgs/development/libraries/wayland/protocols.nix"
          text = protocols.read_text()
          text = replace(text, r'  version = ".*?";', f'  version = "{protocol_version}";')
          text = replace(text, r'    hash = "sha256-.*?";', f'    hash = "{protocol_hash}";')
          protocols.write_text(text)

          recipe = mesa / "default.nix"
          text = recipe.read_text()
          text = replace(text, r'  patches = \[.*?\n  \];', '  patches = [];')
          # The separate nixpkgs header package tracks a different Mesa release.
          text = replace(text, r"  postPatch = ''.*?\n  '';", "  postPatch = ''patchShebangs .'';")
          text = replace(text, r'  outputs = \[.*?\n  \];', '  outputs = [ "out" ];')
          text = replace(text, r'  mesonFlags = \[', '  mesonBuildType = "release";\n\n  mesonFlags = [')
          flags = [
              "-Dplatforms=x11,wayland",
              "-Dgallium-drivers=",
              "-Dgallium-va=disabled",
              "-Dgallium-mediafoundation=disabled",
              "-Dvulkan-drivers=freedreno",
              "-Dvulkan-layers=",
              "-Dgles1=disabled",
              "-Dgles2=disabled",
              "-Dopengl=false",
              "-Dgbm=disabled",
              "-Dglx=disabled",
              "-Dxlib-lease=disabled",
              "-Dfreedreno-kmds=kgsl",
              "-Degl=disabled",
              "-Dglvnd=disabled",
              "-Dintel-rt=disabled",
              "-Dmicrosoft-clc=disabled",
              "-Dllvm=disabled",
              "-Dvalgrind=disabled",
              "-Dbuild-tests=false",
              "-Dlibunwind=disabled",
              "-Dlmsensors=disabled",
              "-Dandroid-libbacktrace=disabled",
              "-Dlibgbm-external=false",
              "-Dgallium-rusticl=false",
              "-Dteflon=false",
          ]
          text = replace(text, r'  mesonFlags = \[.*?\n  \];',
                         '  mesonFlags = [\n' + ''.join(f'    "{flag}"\n' for flag in flags) + '  ];')
          text = replace(text, r"  postInstall = ''.*?\n  '';", "  postInstall = '''';")
          # Keep absolute Nix store paths in EGL manifests when this build emits them.
          text = replace(text, r"  postFixup = ''.*?\n  '';", """  postFixup = ''
              for js in $out/share/glvnd/egl_vendor.d/*.json; do
                [ -e "$js" ] || continue
                substituteInPlace "$js" --replace-fail '"libEGL_' '"'"$out/lib/libEGL_"
              done
            '';""")
          recipe.write_text(text)
          PY

      - name: Build and export Mesa Nix closure
        shell: bash
        run: |
          mkdir -p ~/mesa-nixos-artifacts
          docker run --privileged --rm \
            -v "$HOME/mesa-for-android-container:/mesa-for-android-container:ro" \
            -v "$HOME/nixpkgs:/nixpkgs:ro" \
            -v "$HOME/mesa-nixos-artifacts:/artifacts" \
            -e MESA_RELEASE_NAME_SUFFIX \
            nixos/nix:latest \
            bash -euo pipefail -c '
              nix-build /nixpkgs -A mesa --out-link /artifacts/result
              result_path=$(readlink -f /artifacts/result)
              echo "$result_path" > /artifacts/result-path.txt
              nix-store --query --requisites "$result_path" > /artifacts/closure-paths.txt
              mapfile -t closure_paths < /artifacts/closure-paths.txt
              nix-store --export "${closure_paths[@]}" | gzip > "/artifacts/turnip-weekly_${MESA_RELEASE_NAME_SUFFIX}.nar.gz"
            '
          sudo chown -R "$(id -u):$(id -g)" ~/mesa-nixos-artifacts
          cat > ~/mesa-nixos-artifacts/install.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          artifact_dir=$(CDPATH='' cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)
          nar_path=$(find "$artifact_dir" -maxdepth 1 -name 'turnip-weekly_*.nar.gz' -type f -print -quit)
          test -n "$nar_path"

          gzip -dc "$nar_path" | nix-store --import >/dev/null
          result_path=$(cat "$artifact_dir/result-path.txt")
          case "$result_path" in
            /nix/store/*) ;;
            *) echo "Invalid Nix store path: $result_path" >&2; exit 1 ;;
          esac

          install_method=${MESA_NIX_INSTALL_METHOD:-auto}
          install_method_used=

          install_with_nix_profile() {
            command -v nix >/dev/null 2>&1 || return 1
            if nix --extra-experimental-features 'nix-command flakes' profile install "$result_path"; then
              install_method_used=nix-profile
              return 0
            fi
            return 1
          }

          install_with_nix_env() {
            command -v nix-env >/dev/null 2>&1 || return 1
            nix-env -i "$result_path"
            install_method_used=nix-env
          }

          case "$install_method" in
            auto)
              install_with_nix_profile || install_with_nix_env || {
                echo "Neither 'nix profile install' nor 'nix-env -i' succeeded." >&2
                exit 1
              }
              ;;
            nix-profile|profile)
              install_with_nix_profile || {
                echo "Requested nix profile installation, but it is unavailable." >&2
                exit 1
              }
              ;;
            nix-env|env)
              install_with_nix_env || {
                echo "Requested nix-env installation, but nix-env is unavailable." >&2
                exit 1
              }
              ;;
            *)
              echo "Unknown MESA_NIX_INSTALL_METHOD: $install_method" >&2
              echo "Use auto, nix-profile, or nix-env." >&2
              exit 1
              ;;
          esac

          echo "Installed $result_path with $install_method_used."

          if [ "${MESA_NIXOS_SWITCH:-1}" = 0 ]; then
            echo "NixOS system driver switch disabled by MESA_NIXOS_SWITCH=0."
            exit 0
          fi

          if [ ! -e /etc/NIXOS ] && [ ! -d /etc/nixos ]; then
            echo "NixOS not detected; leaving the installed profile unchanged."
            exit 0
          fi

          nixos_rebuild=$(command -v nixos-rebuild || true)
          if [ -z "$nixos_rebuild" ]; then
            echo "NixOS detected, but nixos-rebuild is unavailable." >&2
            exit 1
          fi
          if [ ! -f /etc/nixos/configuration.nix ]; then
            echo "NixOS detected, but /etc/nixos/configuration.nix is missing." >&2
            exit 1
          fi

          overlay=$(mktemp /tmp/mesa-nixos-configuration.XXXXXX.nix)
          trap 'rm -f "$overlay"' EXIT
          cat > "$overlay" <<EOF_CONFIG
          { lib, ... }:
          {
            imports = [ /etc/nixos/configuration.nix ];
            hardware.graphics.enable = lib.mkForce true;
            hardware.graphics.package = lib.mkForce $result_path;
          }
          EOF_CONFIG

          if [ "$(id -u)" -eq 0 ]; then
            "$nixos_rebuild" switch -I nixos-config="$overlay"
          else
            sudo "$nixos_rebuild" switch -I nixos-config="$overlay"
          fi
          echo "Switched the NixOS system graphics driver to $result_path."
          EOF
          chmod 755 ~/mesa-nixos-artifacts/install.sh
          tar -cf "$HOME/mesa-nixos-artifacts/turnip-weekly_${MESA_RELEASE_NAME_SUFFIX}.tar" \
            -C "$HOME/mesa-nixos-artifacts" \
            "turnip-weekly_${MESA_RELEASE_NAME_SUFFIX}.nar.gz" result-path.txt closure-paths.txt install.sh
          (cd ~/mesa-nixos-artifacts && sha256sum "turnip-weekly_${MESA_RELEASE_NAME_SUFFIX}.tar" > sha256sums.txt)
          cat ~/mesa-nixos-artifacts/sha256sums.txt

      - name: Upload installable Mesa Nix closure
        uses: actions/upload-artifact@v7
        with:
          name: turnip-weekly_${{ env.MESA_RELEASE_NAME_SUFFIX }}_${{ needs.prepare-source.outputs.mesa_hash }}
          path: |
            ~/mesa-nixos-artifacts/turnip-weekly_${{ env.MESA_RELEASE_NAME_SUFFIX }}.tar
            ~/mesa-nixos-artifacts/sha256sums.txt
          retention-days: 90

