          echo "MESA_RELEASE_NAME_SUFFIX=${version}-${short_hash}_archlinux_arm64" >> "$GITHUB_ENV"

      - name: Build Mesa
        shell: bash
        run: |
          export CCACHE_DIR=/root/.ccache
