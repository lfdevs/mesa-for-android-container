  nixos:
    runs-on: ubuntu-26.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Clone nixpkgs
        run: |
          git clone --branch nixos-26.05 --depth 1 https://github.com/NixOS/nixpkgs.git "$HOME/nixpkgs"

      - name: Set release name suffix
        shell: bash
        env:
          SOURCE_REF: ${{ github.event.inputs.tag }}
        run: |
          cd "$GITHUB_WORKSPACE"
          version=$(grep -v '^[[:space:]]*$' VERSION | head -n1)
          build_date=$(TZ=Asia/Shanghai date +%Y%m%d)
          source_ref="${SOURCE_REF#refs/tags/}"
          if [[ "$source_ref" =~ ^(mesa|turnip)-.*-devel-([0-9]{8}(-r[0-9]+)?)$ ]]; then
            build_date="${BASH_REMATCH[2]}"
          fi
          echo "MESA_RELEASE_NAME_SUFFIX=${version}-${build_date}_nixos_arm64" >> "$GITHUB_ENV"

      - name: Configure nixpkgs Mesa
        shell: bash
        run: |
          export MESA_VERSION="${MESA_RELEASE_NAME_SUFFIX%_nixos_arm64}"
          python3 <<'PY'
          import os
          from pathlib import Path
          import re

          mesa = Path.home() / "nixpkgs/pkgs/development/libraries/mesa"

          def replace(text, pattern, replacement):
              text, count = re.subn(pattern, lambda _: replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise RuntimeError(f"Mesa recipe no longer matches: {pattern}")
              return text

          common = mesa / "common.nix"
          text = common.read_text()
          text = replace(text, r'  version = ".*?";', f'  version = "{os.environ["MESA_VERSION"]}";')
          # Use the checkout mounted in the build container, without a fixed-output hash.
          text = replace(text, r'  src = fetchFromGitLab \{.*?\n  \};',
                         '  src = lib.cleanSource /mesa-for-android-container;')
          common.write_text(text)

          recipe = mesa / "default.nix"
          text = recipe.read_text()
          text = replace(text, r'  patches = \[.*?\n  \];', '  patches = [];')
          # The separate nixpkgs header package tracks a different Mesa release.
          text = replace(text, r"  postPatch = ''.*?\n  '';", "  postPatch = ''patchShebangs .'';")
          text = replace(text, r'  outputs = \[.*?\n  \];', '  outputs = [ "out" ];')
          text = replace(text, r'  mesonFlags = \[', '  mesonBuildType = "release";\n\n  mesonFlags = [')
          flags = [
              "-Dplatforms=x11,wayland",
              "-Dgallium-drivers=freedreno,zink,virgl,llvmpipe",
              "-Dgallium-va=enabled",
              "-Dtermux-va-bridge=enabled",
              "-Dtermux-va-wayland-shim=enabled",
              "-Dvideo-codecs=all",
              "-Dgallium-mediafoundation=disabled",
              "-Dandroid-libbacktrace=disabled",
              "-Dvulkan-drivers=freedreno",
              "-Dvulkan-layers=",
              "-Degl=enabled",
              "-Dgles2=enabled",
              "-Dglvnd=enabled",
              "-Dglx=dri",
              "-Dlibunwind=disabled",
              "-Dintel-rt=disabled",
              "-Dmicrosoft-clc=disabled",
              "-Dvalgrind=disabled",
              "-Dgles1=disabled",
              "-Dfreedreno-kmds=kgsl",
              "-Dlibgbm-external=false",
              "-Dgallium-rusticl=false",
              "-Dteflon=false",
          ]
          text = replace(text, r'  mesonFlags = \[.*?\n  \];',
                         '  mesonFlags = [\n' + ''.join(f'    "{flag}"\n' for flag in flags) + '  ];')
          text = replace(text, r"  postInstall = ''.*?\n  '';", "  postInstall = '''';")
          # Keep Nix store paths in manifests and let Zink find the Vulkan loader.
          text = replace(text, r"  postFixup = ''.*?\n  '';", """  postFixup = ''
              for js in $out/share/glvnd/egl_vendor.d/*.json; do
                substituteInPlace "$js" --replace-fail '"libEGL_' '"'"$out/lib/libEGL_"
              done
              patchelf --add-rpath ${vulkan-loader}/lib $out/lib/libgallium*.so
            '';""")
          recipe.write_text(text)
          PY

      - name: Build and export Mesa Nix closure
        shell: bash
        run: |
          mkdir -p ~/mesa-nixos-artifacts
          docker run --privileged --rm \
            -v "$GITHUB_WORKSPACE:/mesa-for-android-container:ro" \
            -v "$HOME/nixpkgs:/nixpkgs:ro" \
            -v "$HOME/mesa-nixos-artifacts:/artifacts" \
            -e MESA_RELEASE_NAME_SUFFIX \
            nixos/nix:latest \
            bash -euo pipefail -c '
              nix-build /nixpkgs -A mesa --out-link /artifacts/result
              result_path=$(readlink -f /artifacts/result)
              echo "$result_path" > /artifacts/result-path.txt
              nix-store --query --requisites "$result_path" > /artifacts/closure-paths.txt
              mapfile -t closure_paths < /artifacts/closure-paths.txt
              nix-store --export "${closure_paths[@]}" | gzip > "/artifacts/mesa-for-android-container_${MESA_RELEASE_NAME_SUFFIX}.nar.gz"
            '
          sudo chown -R "$(id -u):$(id -g)" ~/mesa-nixos-artifacts
          cat > ~/mesa-nixos-artifacts/install.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          artifact_dir=$(CDPATH='' cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)
          nar_path=$(find "$artifact_dir" -maxdepth 1 -name 'mesa-for-android-container_*.nar.gz' -type f -print -quit)
          test -n "$nar_path"

          gzip -dc "$nar_path" | nix-store --import >/dev/null
          result_path=$(cat "$artifact_dir/result-path.txt")
          case "$result_path" in
            /nix/store/*) ;;
            *) echo "Invalid Nix store path: $result_path" >&2; exit 1 ;;
          esac

          install_method=${MESA_NIX_INSTALL_METHOD:-auto}
          install_method_used=

          install_with_nix_profile() {
            command -v nix >/dev/null 2>&1 || return 1
            if nix --extra-experimental-features 'nix-command flakes' profile install "$result_path"; then
              install_method_used=nix-profile
              return 0
            fi
            return 1
          }

          install_with_nix_env() {
            command -v nix-env >/dev/null 2>&1 || return 1
            nix-env -i "$result_path"
            install_method_used=nix-env
          }

          case "$install_method" in
            auto)
              install_with_nix_profile || install_with_nix_env || {
                echo "Neither 'nix profile install' nor 'nix-env -i' succeeded." >&2
                exit 1
              }
              ;;
            nix-profile|profile)
              install_with_nix_profile || {
                echo "Requested nix profile installation, but it is unavailable." >&2
                exit 1
              }
              ;;
            nix-env|env)
              install_with_nix_env || {
                echo "Requested nix-env installation, but nix-env is unavailable." >&2
                exit 1
              }
              ;;
            *)
              echo "Unknown MESA_NIX_INSTALL_METHOD: $install_method" >&2
              echo "Use auto, nix-profile, or nix-env." >&2
              exit 1
              ;;
          esac

          echo "Installed $result_path with $install_method_used."

          if [ "${MESA_NIXOS_SWITCH:-1}" = 0 ]; then
            echo "NixOS system driver switch disabled by MESA_NIXOS_SWITCH=0."
            exit 0
          fi

          if [ ! -e /etc/NIXOS ] && [ ! -d /etc/nixos ]; then
            echo "NixOS not detected; leaving the installed profile unchanged."
            exit 0
          fi

          nixos_rebuild=$(command -v nixos-rebuild || true)
          if [ -z "$nixos_rebuild" ]; then
            echo "NixOS detected, but nixos-rebuild is unavailable." >&2
            exit 1
          fi
          if [ ! -f /etc/nixos/configuration.nix ]; then
            echo "NixOS detected, but /etc/nixos/configuration.nix is missing." >&2
            exit 1
          fi

          overlay=$(mktemp /tmp/mesa-nixos-configuration.XXXXXX.nix)
          trap 'rm -f "$overlay"' EXIT
          cat > "$overlay" <<EOF_CONFIG
          { lib, ... }:
          {
            imports = [ /etc/nixos/configuration.nix ];
            hardware.graphics.enable = lib.mkForce true;
            hardware.graphics.package = lib.mkForce $result_path;
          }
          EOF_CONFIG

          if [ "$(id -u)" -eq 0 ]; then
            "$nixos_rebuild" switch -I nixos-config="$overlay"
          else
            sudo "$nixos_rebuild" switch -I nixos-config="$overlay"
          fi
          echo "Switched the NixOS system graphics driver to $result_path."
          EOF
          chmod 755 ~/mesa-nixos-artifacts/install.sh
          tar -cf "$HOME/mesa-nixos-artifacts/mesa-for-android-container_${MESA_RELEASE_NAME_SUFFIX}.tar" \
            -C "$HOME/mesa-nixos-artifacts" \
            "mesa-for-android-container_${MESA_RELEASE_NAME_SUFFIX}.nar.gz" result-path.txt closure-paths.txt install.sh
          (cd ~/mesa-nixos-artifacts && sha256sum "mesa-for-android-container_${MESA_RELEASE_NAME_SUFFIX}.tar" > sha256sums.txt)
          cat ~/mesa-nixos-artifacts/sha256sums.txt

      - name: Upload installable Mesa Nix closure
        uses: actions/upload-artifact@v7
        with:
          name: mesa-for-android-container_${{ env.MESA_RELEASE_NAME_SUFFIX }}
          path: |
            ~/mesa-nixos-artifacts/mesa-for-android-container_${{ env.MESA_RELEASE_NAME_SUFFIX }}.tar
            ~/mesa-nixos-artifacts/sha256sums.txt
          retention-days: 90

  steamos:
    runs-on: ubuntu-26.04-arm
    container:
      image: lfdevs/holo-core:base-devel
      options: --privileged --user root

    steps:
      - name: Install dependencies
        run: |
          retry() {
            local max_attempts="$1"
            local delay_seconds="$2"
            shift 2
            local attempt=1

            until "$@"; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "Command failed after ${max_attempts} attempts: $*"
                return 1
              fi
              echo "Attempt ${attempt}/${max_attempts} failed: $*"
              echo "Retrying in ${delay_seconds}s..."
              sleep "$delay_seconds"
              attempt=$((attempt + 1))
            done
          }

          retry 5 30 pacman -Syyu --noconfirm
          retry 5 30 pacman -S --noconfirm base-devel git ccache clang directx-headers expat glibc libdisplay-info libdrm libelf libgcc libglvnd libpng libstdc++ libva libx11 libxcb libxext libxml2 libxrandr libxshmfence libxxf86vm llvm llvm-libs lm_sensors rust spirv-llvm-translator spirv-tools systemd-libs vulkan-icd-loader wayland xcb-util-keysyms zlib zstd cbindgen clang cmake elfutils glslang libclc meson python-mako python-packaging python-ply python-pycparser python-yaml rust-bindgen wayland-protocols xorgproto libsysprof-capture valgrind python-sphinx python-sphinx-hawkmoth byacc flex wayland wayland-protocols

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: /root/.ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-

      - name: Configure ccache
        run: |
          export CCACHE_DIR=/root/.ccache
          ccache --max-size=2G
          ccache --show-config
          ccache --zero-stats
          ccache --show-stats

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Set release name suffix
        shell: bash
        env:
          SOURCE_REF: ${{ github.event.inputs.tag }}
        run: |
          cd "$GITHUB_WORKSPACE"
          version=$(grep -v '^[[:space:]]*$' VERSION | head -n1)
          build_date=$(TZ=Asia/Shanghai date +%Y%m%d)
          source_ref="${SOURCE_REF#refs/tags/}"
          if [[ "$source_ref" =~ ^(mesa|turnip)-.*-devel-([0-9]{8}(-r[0-9]+)?)$ ]]; then
            build_date="${BASH_REMATCH[2]}"
          fi
          echo "MESA_RELEASE_NAME_SUFFIX=${version}-${build_date}_steamos_arm64" >> "$GITHUB_ENV"

      - name: Build Mesa
        shell: bash
        run: |
          export CCACHE_DIR=/root/.ccache
          echo "Building Mesa..."
          cd "$GITHUB_WORKSPACE"
          meson setup build/ \
            --prefix=/usr \
            -Dplatforms=x11,wayland \
            -Dgallium-drivers=freedreno,zink,virgl,llvmpipe \
            -Dgallium-va=enabled \
            -Dtermux-va-bridge=enabled \
            -Dtermux-va-wayland-shim=enabled \
            -Dvideo-codecs=all \
            -Dgallium-mediafoundation=disabled \
            -Dvulkan-drivers=freedreno \
            -Dvulkan-layers= \
            -Degl=enabled \
            -Dgles2=enabled \
            -Dglvnd=enabled \
            -Dglx=dri \
            -Dlibunwind=disabled \
            -Dintel-rt=disabled \
            -Dmicrosoft-clc=disabled \
            -Dvalgrind=disabled \
            -Dgles1=disabled \
            -Dfreedreno-kmds=kgsl \
            -Dbuildtype=release
          ninja -C build/
          echo "Mesa build completed successfully!"

      - name: Save ccache
        uses: actions/cache/save@v6
        if: always()
        with:
          path: /root/.ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Package Mesa
        shell: bash
        run: |
          echo "Packaging Mesa..."
          cd "$GITHUB_WORKSPACE"
          mkdir /tmp/mesa-install-tmp
          DESTDIR=/tmp/mesa-install-tmp meson install -C build/
          tar -zcvf mesa-for-android-container_${MESA_RELEASE_NAME_SUFFIX}.tar.gz -C /tmp/mesa-install-tmp .
          rm -rf /tmp/mesa-install-tmp
          echo "Calculating sha256 checksums..."
          find . -maxdepth 1 \( -name "*.tar.gz" \) -type f -printf "%P\0" | xargs -0 sha256sum | sort -k2 > sha256sums.txt
          cat sha256sums.txt && echo
          echo "Packaging completed successfully!"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mesa-for-android-container_${{ env.MESA_RELEASE_NAME_SUFFIX }}
          path: |
            *.tar.gz
            sha256sums.txt
          retention-days: 90

  draft-release:
    if: ${{ github.event.inputs.draft_release == 'true' }}
    needs:
      - debian-trixie
      - ubuntu-noble
      - ubuntu-questing
      - ubuntu-resolute
      - fedora-43
      - fedora-44
      - archlinux
      - void-linux
      - alpine-324
      - debian-testing
      - ubuntu-rolling
      - fedora-45
      - opensuse-tumbleweed
      - deepin-crimson
      - aosc
      - nixos
      - steamos
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts

      - name: Build release notes with checksums
        shell: bash
        run: |
          set -euo pipefail
          checksums=$(find ./artifacts -type f -name "sha256sums.txt" -exec cat {} \; -exec echo \; | awk 'NF>=2 {print $1 "  " $2}' | sort -k2,2)
          cat <<'EOF' > release_body.md
          ## Checksums
          ```plaintext
          EOF
          printf '%s\n' "$checksums" >> release_body.md
          printf '%s\n' '```' >> release_body.md

      - name: Set release title
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag }}"
          echo "RELEASE_TITLE=${tag#mesa-}" >> "$GITHUB_ENV"

      - name: Upload archives to draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: ${{ env.RELEASE_TITLE }}
          draft: true
          body_path: release_body.md
          files: |
            ./artifacts/**/*.tar.gz
            ./artifacts/**/*.tar
