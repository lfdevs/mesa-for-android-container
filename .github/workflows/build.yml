  archlinux:
    runs-on: ubuntu-24.04-arm
    container:
      image: lfdevs/archlinuxarm:base-devel
      options: --privileged --user root

    steps:
      - name: Install dependencies
        run: |
          pacman -Syyu --noconfirm
          pacman -S --noconfirm sudo base-devel git ccache

      - name: Setup runner user
        run: |
          useradd -m -s /bin/bash runner
          echo "runner ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/runner
          chmod 0440 /etc/sudoers.d/runner
          mkdir -p /home/runner/.ccache
          chown -R runner:runner /home/runner

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: /home/runner/.ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-runner-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-runner-

      - name: Configure ccache
        run: |
          chown -R runner:runner /home/runner/.ccache
          sudo -u runner bash -c '
            export CCACHE_DIR=/home/runner/.ccache
            ccache --max-size=2G
            ccache --show-config
            ccache --zero-stats
            ccache --show-stats
          '

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          repository: lfdevs/archlinuxarm-PKGBUILDs
          ref: ${{ (github.event.inputs.tag == 'dev/adreno-main' || github.event.inputs.tag == 'adreno-main') && 'freedreno' || github.event.inputs.tag }}
          path: archlinuxarm-PKGBUILDs
          fetch-depth: 0

      - name: Configure Git
        run: |
          sudo chown -R runner:runner "$GITHUB_WORKSPACE/archlinuxarm-PKGBUILDs"
          sudo -u runner bash -c '
            git config --global user.email "actions@github.com"
            git config --global user.name "GitHub Actions"
          '

      - name: Set release name suffix
        shell: bash
        env:
          SOURCE_REF: ${{ github.event.inputs.tag }}
        run: |
          cd "$GITHUB_WORKSPACE/archlinuxarm-PKGBUILDs/extra/mesa"
          version=$(awk -F= '/^pkgver=/{print $2; exit}' PKGBUILD)
          build_date=$(TZ=Asia/Shanghai date +%Y%m%d)
          source_ref="${SOURCE_REF#refs/tags/}"
          if [[ "$source_ref" =~ ^(mesa|turnip)-.*-devel-([0-9]{8}(-r[0-9]+)?)$ ]]; then
            build_date="${BASH_REMATCH[2]}"
          fi
          echo "MESA_RELEASE_NAME_SUFFIX=${version}-devel-${build_date}_archlinux_arm64" >> "$GITHUB_ENV"

      - name: Build Mesa
        shell: bash
        run: |
          source_dir="$GITHUB_WORKSPACE/archlinuxarm-PKGBUILDs/extra/mesa"
          sudo -u runner bash -c '
            export CCACHE_DIR=/home/runner/.ccache
            echo "Building Mesa..."
            cd "$1"
            makepkg -s --noconfirm
            echo "Mesa build completed successfully!"
          ' -- "$source_dir"

      - name: Save ccache
        uses: actions/cache/save@v6
        if: always()
        with:
          path: /home/runner/.ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-runner-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Package Mesa
        shell: bash
        run: |
          echo "Packaging Mesa..."
          cd "$GITHUB_WORKSPACE/archlinuxarm-PKGBUILDs/extra/mesa"
          tar -cvf mesa-for-android-container_${MESA_RELEASE_NAME_SUFFIX}.tar *.pkg.tar.xz
          echo "Calculating sha256 checksums..."
          find . -maxdepth 1 \( -name "*.tar" \) -type f -printf "%P\0" | xargs -0 sha256sum | sort -k2 > sha256sums.txt
          cat sha256sums.txt && echo
          echo "Packaging completed successfully!"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mesa-for-android-container_${{ env.MESA_RELEASE_NAME_SUFFIX }}
          path: |
